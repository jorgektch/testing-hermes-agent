name: Hermes v11 validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest httpx2 'fastapi>=0.115,<1' 'pydantic>=2.10,<3' 'uvicorn>=0.32,<1' 'libsql>=0.1,<1'
      - name: Validate Python syntax
        run: python -m compileall -q backend
      - name: Run backend unit and regression tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
      - name: Check public catalog source consistency
        run: |
          python scripts/build_catalog_from_blackpenguin.py
          git diff --exit-code -- shared/catalog.json backend/app/catalog.json

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
